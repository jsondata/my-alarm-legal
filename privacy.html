<body>
    <h1>My闹钟隐私政策</h1>
    <p>生效日期：2026年11月17日</p>
    <p>My闹钟不需要账号。闹钟名称、时间和跳过记录只保存在这台手机上。</p>
    <p>判断工作日时，App 会向第三方节假日接口 timor.tech 请求指定年份的放假和调休日期。App 不会在请求中发送闹钟名称、时间或设备标识。接口服务器在处理网络请求时可以看到连接的 IP 地址。下载的放假表会缓存到本机，供离线使用。</p>
    <p>联系：support@banring.app</p>
</body>
